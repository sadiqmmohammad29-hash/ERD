<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Management System - Entity Relationship Diagram</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<style>
  :root{--ink:#14213d;--teal:#0b7a75;--paper:#f6f8fb;--line:#d5dce8;--muted:#5b6678}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink)}
  header{background:var(--ink);color:#fff;padding:20px 24px}
  header h1{margin:0 0 4px;font-size:1.35rem;font-weight:650}
  header p{margin:0;font-size:.85rem;color:#b9c4d9}
  nav{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 12px;border-radius:6px;font-size:.82rem;cursor:pointer}
  nav button.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;font-size:.8rem;color:var(--muted)}
  .bar b{color:var(--ink)}
  .legend{display:flex;gap:14px;flex-wrap:wrap}
  .legend span{background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 8px}
  .tools{margin-left:auto;display:flex;gap:6px}
  .tools button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:5px 10px;cursor:pointer}
  .panel{display:none;padding:0 16px 24px}
  .desc{font-size:.88rem;color:var(--muted);margin:4px 0 12px;max-width:900px;line-height:1.5}
  .canvas{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:auto;padding:16px;min-height:300px}
  table{border-collapse:collapse;width:100%;background:#fff;font-size:.84rem}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  th{background:var(--ink);color:#fff;font-weight:600}
  td:nth-child(3){white-space:nowrap;font-weight:600;color:var(--teal)}
  .err{color:#b3261e;font-size:.85rem;white-space:pre-wrap}
  @media print{nav,.bar .tools{display:none}.panel{display:block!important;page-break-after:always}}
</style>
</head>
<body>
<header>
  <h1>School Management System: Entity Relationship Diagram</h1>
  <p>Logical data model, v1.0 | Crow's Foot notation | Admissions to Alumni, Academics, Co-curricular, Finance, Security</p>
</header>

<nav id="tabs"></nav>

<div class="bar">
  <div class="legend">
    <span><b>||</b> exactly one</span>
    <span><b>|o</b> zero or one</span>
    <span><b>}|</b> one or many</span>
    <span><b>}o</b> zero or many</span>
    <span><b>PK</b> primary key</span>
    <span><b>FK</b> foreign key</span>
    <span><b>UK</b> unique</span>
  </div>
  <div class="tools">
    <button onclick="zoom(-0.15)">Zoom -</button>
    <button onclick="zoom(0.15)">Zoom +</button>
    <button onclick="window.print()">Print / PDF</button>
  </div>
</div>

<div id="panels"></div>

    }
    DISCIPLINARY_RECORD {
        int record_id PK
        int student_id FK
        int reported_by FK
        date incident_date
        string incident_type
        string severity "Minor, Major, Critical"
        string description
        string action_taken
        boolean guardian_notified
        string status "Open, Resolved, Escalated"
        date resolved_on
    }
    STUDENT {
        int student_id PK
    }
    STAFF {
        int staff_id PK
    }
    GUARDIAN {
        int guardian_id PK
    }
`;

const RULES = [
 ["Admission Cycle to Application","1 : N","One cycle receives many applications. An application belongs to exactly one cycle. Closed cycles reject new applications."],
 ["Application to Admission Decision","1 : 0..1","Each application has at most one final decision. Offers carry an expiry date, after which the seat is released."],
 ["Application to Student","1 : 0..1","A student record is created only after the seat is confirmed and fees are received. Admission number is generated once."],
 ["Student to Guardian (via Student Guardian)","M : N","A student can have several guardians, and a guardian can have several children. Every student needs one primary contact and one emergency contact."],
 ["Student to Medical Record","1 : 0..1","One confidential health record per student. Access is limited to nurse, principal and the guardian."],
 ["Grade Level to Section","1 : N","A grade is split into sections per academic year. Section size cannot exceed its capacity."],
 ["Student to Section (via Class Enrollment)","M : N over time","A student has exactly one active section per academic year. History is kept when a student moves."],
 ["Course to Course Offering","1 : N","A course is offered many times across sections and years. Each offering has exactly one teacher."],
 ["Student to Course Offering (via Course Enrollment)","M : N","Covers electives and core subjects. Timetable clashes for a student or teacher are blocked."],
 ["Course Enrollment to Attendance","1 : N","One attendance entry per student per timetable slot per date. Edits after lock date need approval."],
 ["Assessment to Assessment Result","1 : N","One result per student per assessment (unique pair). Results stay hidden until published."],
 ["Student to Report Card","1 : N","One report card per student per term, approved by the class teacher or principal before release."],
 ["Student to Club (via Club Membership)","M : N","Membership needs advisor approval. A club cannot exceed max members. Students can hold a configurable maximum number of clubs."],
 ["Sports Trial to Trial Registration","1 : N","This is the sports admission step. Registration needs fitness clearance and guardian consent before the trial."],
 ["Sports Team to Team Membership","1 : N","A selected student joins a team with a jersey number that is unique within the team."],
 ["Extra Class to Extra Class Enrollment","1 : N","Enrollment is capped by class capacity. A confirmed enrollment adds a line to the student invoice."],
 ["Field Trip to Trip Registration","1 : N","A student cannot travel without signed guardian consent. The trip needs a completed risk assessment."],
 ["Registration to Guardian Consent","0..1 : 0..1","Each consent record points to one trip or one trial registration. Consent time and signature are stored as proof."],
 ["Fee Structure to Fee Item","1 : 1..N","A fee structure must contain at least one fee item. It is defined per grade and academic year."],
 ["Invoice to Invoice Line","1 : 1..N","An invoice has at least one line. Lines can come from fee items, extra classes, trips or late fees."],
 ["Invoice to Payment","1 : N","Part payments are allowed. Total payments cannot exceed the net invoice amount. Invoice status updates automatically."],
 ["Payment to Refund","1 : N","Refunds need approval by an authorised finance user and cannot exceed the amount paid."],
 ["User to Role, Role to Permission","M : N","Access is role based. Sensitive actions such as grade edits, fee waivers and record deletion need approval permissions."],
 ["User Account to Audit Log","1 : N","Audit entries are append-only. Every create, update, delete and export on sensitive data is logged with old and new values."]
];

const TABS = [
 ["overview","Overview","High level map of how every module connects to the student. Attributes are hidden here and shown in the module views."],
 ["admissions","Admissions & Student Records","Journey from enquiry to enrolled student: application, documents, entrance test, interview, decision, then student, guardian and medical records."],
 ["academics","Academics","Academic year, terms, sections, courses, timetable, attendance, assessments, results and report cards."],
 ["cocurricular","Clubs, Sports & Trips","Club joining, sports trials (sports admissions), teams, fixtures, extra classes, field trips, guardian consent and achievements."],
 ["finance","Fees & Finance","Fee structures, invoices, payments, refunds and scholarships."],
 ["security","Security & Compliance","Users, roles, permissions, audit trail, notifications and disciplinary records."],
 ["rules","Cardinality & Business Rules","Plain-language reading of each key relationship for client review and sign-off."]
];

let zoomLevel = 1;
const rendered = {};

mermaid.initialize({
  startOnLoad:false,
  securityLevel:"loose",
  theme:"base",
  themeVariables:{
    primaryColor:"#eaf3f2", primaryBorderColor:"#14213d", primaryTextColor:"#14213d",
    lineColor:"#14213d", secondaryColor:"#ffffff", tertiaryColor:"#f6f8fb",
    fontFamily:"Segoe UI, Roboto, Helvetica, Arial, sans-serif", fontSize:"14px"
  },
  er:{useMaxWidth:false, layoutDirection:"TB", minEntityWidth:130, minEntityHeight:60, entityPadding:12, stroke:"#14213d", fill:"#ffffff"}
});

const nav = document.getElementById("tabs");
const panels = document.getElementById("panels");

TABS.forEach(([key,label,desc])=>{
  const b = document.createElement("button");
  b.textContent = label; b.id = "tab-"+key;
  b.onclick = ()=>show(key);
  nav.appendChild(b);

  const p = document.createElement("section");
  p.className = "panel"; p.id = "panel-"+key;
  p.innerHTML = '<p class="desc">'+desc+'</p>';
  if(key==="rules"){
    let rows = RULES.map((r,i)=>"<tr><td>"+(i+1)+"</td><td>"+r[0]+"</td><td>"+r[1]+"</td><td>"+r[2]+"</td></tr>").join("");
    p.innerHTML += '<table><thead><tr><th>#</th><th>Relationship</th><th>Cardinality</th><th>Business rule</th></tr></thead><tbody>'+rows+'</tbody></table>';
  } else {
    p.innerHTML += '<div class="canvas" id="canvas-'+key+'">Loading diagram...</div>';
  }
  panels.appendChild(p);
});

async function show(key){
  TABS.forEach(([k])=>{
    document.getElementById("tab-"+k).classList.toggle("on", k===key);
    document.getElementById("panel-"+k).style.display = (k===key) ? "block" : "none";
  });
  if(key==="rules" || rendered[key]) { applyZoom(); return; }
  const el = document.getElementById("canvas-"+key);
  try{
    const out = await mermaid.render("erd_"+key, D[key]);
    el.innerHTML = out.svg;
    rendered[key] = true;
    applyZoom();
  }catch(e){
    el.innerHTML = '<div class="err">Diagram could not be drawn. Check your internet connection (the diagram library loads from a CDN).\n\n'+ (e && e.message ? e.message : e) +'</div>';
  }
}

function applyZoom(){
  document.querySelectorAll(".canvas").forEach(c=>{ c.style.zoom = zoomLevel; });
}
function zoom(d){
  zoomLevel = Math.min(2, Math.max(0.3, zoomLevel + d));
  applyZoom();
}

show("overview");
</script>

</body>
</html>
